name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Build deps for PyGObject and dbus-python, and the GStreamer typelibs the tests import.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev libdbus-1-dev libglib2.0-dev pkg-config \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: pip install -r requirements.txt
      - run: pytest -v
