name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      skip_package:
        # The release workflow builds and checks its own wheels.
        type: boolean
        default: false

jobs:
  package:
    if: ${{ !inputs.skip_package }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libwayland-bin pkg-config
      - run: python -m pip install build
      # build creates the wheel from the sdist, checking both distribution formats.
      - run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/snappie-build-data"
          mkdir -p "$XDG_DATA_HOME"
          python -m build
          test -z "$(find "$XDG_DATA_HOME" -mindepth 1 -print -quit)"
      - run: |
          python -m venv "$RUNNER_TEMP/snappie-smoke"
          "$RUNNER_TEMP/snappie-smoke/bin/python" -m pip install --no-deps dist/*.whl
      # Run outside the checkout, without Python runtime dependencies or a desktop.
      - working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/snappie-smoke/bin/snappie" --help
          "$RUNNER_TEMP/snappie-smoke/bin/python" "$GITHUB_WORKSPACE/.github/scripts/check-wheel.py" \
            "$GITHUB_WORKSPACE"/dist/*.whl

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Build deps for PyGObject and dbus-python, and the GStreamer typelibs the tests import.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev libdbus-1-dev libglib2.0-dev pkg-config \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: pip install -r requirements.txt
      - run: pytest -v
