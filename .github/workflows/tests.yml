name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libwayland-bin pkg-config
      - run: python -m pip install build
      # build creates the wheel from the sdist, checking both distribution formats.
      - run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/snappie-build-data"
          mkdir -p "$XDG_DATA_HOME"
          python -m build
          test -z "$(find "$XDG_DATA_HOME" -mindepth 1 -print -quit)"
      - run: |
          python -m venv /tmp/snappie-smoke
          /tmp/snappie-smoke/bin/python -m pip install --no-deps dist/*.whl
      # Run outside the checkout, without Python runtime dependencies or a desktop.
      - working-directory: /tmp
        run: |
          /tmp/snappie-smoke/bin/snappie --help
          /tmp/snappie-smoke/bin/python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from importlib.resources import files

          root = files("snappie")
          for name in ("icons/snappie.svg", "icons/snappie-tray.svg"):
              assert root.joinpath(name).is_file(), name
          assert (root / "helper" / "snappie-cast").read_bytes().startswith(b"\x7fELF")
          with tempfile.TemporaryDirectory() as data:
              # No cc, pkg-config, wayland-scanner, or shell available through PATH.
              env = dict(os.environ, XDG_DATA_HOME=data, PATH="")
              subprocess.run([sys.executable, "-m", "snappie.capture_helper"], env=env, check=True)
              assert os.access(os.path.join(data, "snappie", "snappie-cast"), os.X_OK)
              assert os.path.isfile(os.path.join(data, "applications", "snappie-cast.desktop"))
          PY
      - run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          assert "-py3-none-linux_" in wheels[0].name, wheels[0]
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/WHEEL"))
              assert "Root-Is-Purelib: false" in archive.read(metadata).decode()
          PY

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Build deps for PyGObject and dbus-python, and the GStreamer typelibs the tests import.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev libdbus-1-dev libglib2.0-dev pkg-config \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: pip install -r requirements.txt
      - run: pytest -v
